name: Backend CI

on:
  push:
    branches: [ production, staging, main ]
  pull_request:
    branches: [ production, staging, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      POSTMARK_API_TOKEN: ${{ secrets.POSTMARK_API_TOKEN }}
      FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
      # Add other dummy envs needed for settings validation
      EMAILS_ENABLED: "False"
      PROJECT_NAME: "Qorebit Backend"
      COPILOT_DATABASE_URI: "postgresql://temporary_unused"
      SQLALCHEMY_DATABASE_URI: "postgresql://temporary_unused"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run Pytest
      run: |
        uv run pytest -v \
          app/tests/api/test_auth.py \
          app/tests/api/test_credits.py \
          app/tests/api/test_organizations.py \
          app/tests/api/test_copilots.py
