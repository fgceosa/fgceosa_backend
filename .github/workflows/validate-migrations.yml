name: Validate Database Migrations

on:
  pull_request:
    paths:
      - 'app/alembic/versions/**'
      - 'app/models/**'
  push:
    branches:
      - main
      - develop
      - production
    paths:
      - 'app/alembic/versions/**'

jobs:
  validate-migrations:
    name: Check Migration Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy

      - name: Check for multiple migration heads
        run: |
          echo "🔍 Checking for multiple migration heads..."
          python3 scripts/validate_migrations.py

      - name: Validate migration file format
        run: |
          echo "🔍 Validating migration file format..."
          python3 scripts/check_migration_format.py

      - name: Check migration history
        run: |
          echo "🔍 Checking migration history..."
          alembic history --verbose

      - name: Check current heads
        run: |
          echo "🔍 Listing current migration heads..."
          HEADS=$(alembic heads)
          echo "$HEADS"
          HEAD_COUNT=$(echo "$HEADS" | grep -v "^$" | wc -l)
          echo "Found $HEAD_COUNT head(s)"

          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "❌ Multiple heads detected! This will cause deployment failures."
            echo "Run: python3 scripts/auto_merge_migrations.py"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          echo "✅ All migration checks passed!"
          echo ""
          echo "Migration validation complete:"
          echo "  ✓ Single migration head confirmed"
          echo "  ✓ All migration files properly formatted"
          echo "  ✓ Migration history is linear"

  test-migrations:
    name: Test Migration Upgrade/Downgrade
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install alembic sqlalchemy psycopg2-binary sqlmodel

      - name: Test upgrade to head
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          echo "🔧 Testing migration upgrade..."
          alembic upgrade head

      - name: Test downgrade one step
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          echo "🔧 Testing migration downgrade..."
          alembic downgrade -1

      - name: Test upgrade again
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          echo "🔧 Testing migration re-upgrade..."
          alembic upgrade head

      - name: Summary
        if: success()
        run: |
          echo "✅ Migration upgrade/downgrade tests passed!"
