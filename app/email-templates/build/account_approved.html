<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 40px; background-color: #f4f4f7; font-family: Inter, Arial, sans-serif;">
  <div style="max-width: 520px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; border: 1px solid #fee2e2;">
    <h1 style="color: #8B0000; font-size: 22px; margin-bottom: 20px;">Account Approved!</h1>
    <p style="color: #475569; font-size: 15px; line-height: 1.6;">Hello {{ username }},</p>
    <p style="color: #475569; font-size: 15px; line-height: 1.6;">Great news! Your account on the ALLFGCEOSA portal has been officially approved.</p>
    <p style="color: #475569; font-size: 15px; line-height: 1.6;">You can now log in and access all features of the alumni platform.</p>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{ login_link }}" style="display: inline-block; padding: 14px 32px; background: #8B0000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">Log In Now</a>
    </div>
    <hr style="border: 0; border-top: 1px solid #fee2e2; margin: 30px 0;">
    <p style="color: #94a3b8; font-size: 12px; text-align: center;">&copy; {{ year }} ALLFGCEOSA &mdash; Connecting Alumni. Celebrating Legacy.</p>
  </div>
</body>
</html>
