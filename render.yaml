services:
  - type: web
    name: fgceosa-backend
    
    runtime: docker
    repo: https://github.com/rockscaleai/qorebit-backend.git
    branch: production
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /api/v1/utils/health-check
    preDeployCommand: bash scripts/migrate.sh
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: PROJECT_NAME
        value: FGC Enugu Alumni Association
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_HOST
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: POSTGRES_SERVER
        fromDatabase:
          name: fgceosa-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: fgceosa-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: fgceosa-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: fgceosa-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: fgceosa-postgres
          property: password
      - key: FIRST_SUPERUSER
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
      
      # --- Email: Postmark ---
      - key: EMAIL_PROVIDER
        value: postmark
      - key: EMAILS_FROM_EMAIL
        value: hello@allfgcealumni.org
      - key: EMAILS_FROM_NAME
        value: FGC Enugu Alumni Association
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: POSTMARK_MESSAGE_STREAM
        value: notification

      # --- Payments: Paystack ---
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co

      # --- Monnify (optional fallback) ---
      - key: MONNIFY_BASE_URL
        value: https://api.monnify.com
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false

databases:
  - name: fgceosa-postgres
    databaseName: fgceosa
    user: fgceosa
    plan: free