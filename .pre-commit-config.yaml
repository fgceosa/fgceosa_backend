# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install

repos:
  # Migration validation
  - repo: local
    hooks:
      - id: check-migration-heads
        name: Check for multiple migration heads
        entry: bash -c 'python3 scripts/validate_migrations.py'
        language: system
        pass_filenames: false
        files: 'app/alembic/versions/.*\.py$'
        stages: [commit]

      - id: check-migration-format
        name: Validate migration file format
        entry: bash -c 'python3 scripts/check_migration_format.py'
        language: system
        files: 'app/alembic/versions/.*\.py$'
        stages: [commit]

  # Python code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        exclude: 'app/alembic/versions/.*\.py$'  # Don't format migration files

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: 'app/alembic/versions/.*\.py$'  # Don't sort imports in migrations
